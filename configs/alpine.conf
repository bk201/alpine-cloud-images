# vim: ts=2 et:

# NOTE: If you are using alpine-cloud-images to build cloud images for
# something/someone other than Alpine Linux, you *MUST* provide the following
# at the top of the config (or override via overlay)...
#
# * 'project' - (required) unique identifier (string value) for your imported
#   images.
# * 'storage_url' - (required) local (file://) or remote (ssh://) location to
#   use as authoritative persistent storage (outside of the git repo).

project     = my-project-identifier
storage_url = "file:///tmp/alpine-cloud-images/{v_version}/{cloud}/{arch}"
#userhost    = someuser@somehost.domain
#storage_url   = "ssh://"${userhost}"/public_html/alpine-cloud-images/{v_version}/{cloud}/{arch}"

# all build configs start with these
Default {
  project     = ${project}
  storage_url = ${storage_url}
  #signing_cmd = "keybase pgp sign -d -i {file} -o {file}.asc"
  #release_cmd = ssh ${userhost} "bin/release-image {v_version} {cloud} {arch} {base}"

  # image name/description components
  name        = [ "{cloud}_alpine" ]
  description = [ Alpine Linux ]

  motd {
    welcome = "Welcome to Alpine!"

    wiki = [
      "The Alpine Wiki contains a large amount of how-to guides and general"
      "information about administrating Alpine systems."
      "See <https://wiki.alpinelinux.org>."
    ]

    release_notes = [
      "Alpine release notes:"
      "* <{release_notes}>"
    ]
  }

  # initial provisioning script and data directory
  scripts     = [ setup ]
  script_dirs = [ setup.d ]

  disk_size       = [256]
  image_format    = qcow2

  login = alpine
}

# profile build matrix
Dimensions {
  version {
    "3.24"  { include required("version/3.24.conf") }
    "3.23"  { include required("version/3.23.conf") }
    "3.22"  { include required("version/3.22.conf") }
    "3.21"  { include required("version/3.21.conf") }
    edge    { include required("version/edge.conf") }
  }
  arch {
    x86_64  { include required("arch/x86_64.conf") }
    aarch64 { include required("arch/aarch64.conf") }
  }
  firmware {
    bios { include required("firmware/bios.conf") }
    uefi { include required("firmware/uefi.conf") }
  }
  bootstrap {
    tiny      { include required("bootstrap/tiny.conf") }
    cloudinit { include required("bootstrap/cloudinit.conf") }
  }
  machine {
    vm    { include required("machine/vm.conf") }
    metal { include required("machine/metal.conf") }
  }
  cloud {
    # the future of all cloud builds
    generic { include required("cloud/generic.conf") }

    # still separate because generic image format is qcow2
    aws     { include required("cloud/aws.conf") }    # .vhd
    azure   { include required("cloud/azure.conf") }  # .vhd
    gcp     { include required("cloud/gcp.conf") }    # .raw.tar.gz

    # as of 3.21, use generic images instead
    #nocloud { include required("cloud/nocloud.conf") }
    #oci     { include required("cloud/oci.conf") }
  }
}

# all build configs merge these at the very end
Mandatory {
  name        = [ "r{revision}" ]
  description = [ "- https://alpinelinux.org/cloud" ]
  encrypted   = false

  # final motd message
  motd.motd_change = "You may change this message by editing /etc/motd."

  # final provisioning script
  scripts = [ cleanup ]
}
